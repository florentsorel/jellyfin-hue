name: '🔬 Run CodeQL'

on:
  push:
    branches: [ master, v10.11 ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ master, v10.11 ]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  call:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@8c80ef19722c31ac9d6eac77b8cd291f9ff8d429 # master
    with:
      repository-name: florentsorel/jellyfin-hue
